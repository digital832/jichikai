<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>防災コーナー設定</title>
<link rel="stylesheet" href="broadcast.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  .sub-button {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: none;
    border-radius: var(--radius-input);
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .map-preview {
    width: 100%;
    height: 220px;
    border-radius: var(--radius-input);
    margin-bottom: 10px;
    background: var(--input-bg);
  }
  .map-hint { font-size: 13px; color: var(--text-sub); margin: 0 0 12px; min-height: 18px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="menu-button" href="broadcast.html" style="text-decoration:none;">▷ 配信ウィザードへ</a>
  </div>

  <div class="card">
    <p class="card-heading"><span class="badge">🏠</span>拠点（自治会館など）</p>
    <div class="field">
      <label class="field-label" for="baseNameInput">名称</label>
      <input class="text-input" id="baseNameInput" placeholder="例：〇〇自治会館" />
    </div>
    <div class="field">
      <label class="field-label" for="baseAddressInput">住所</label>
      <input class="text-input" id="baseAddressInput" placeholder="例：東京都〇〇区〇〇1-2-3" />
    </div>
    <button class="sub-button" type="button" id="baseCheckButton">地図で確認する</button>
    <div class="map-preview" id="baseMap" hidden></div>
    <p class="map-hint" id="baseMapHint"></p>
    <button class="register-button" type="button" id="baseSaveButton" disabled>この内容で保存する</button>
  </div>

  <div class="card">
    <p class="card-heading"><span class="badge">⛑</span>避難所を追加</p>
    <div class="field">
      <label class="field-label" for="shelterNameInput">名称</label>
      <input class="text-input" id="shelterNameInput" placeholder="例：〇〇小学校" />
    </div>
    <div class="field">
      <label class="field-label" for="shelterAddressInput">住所</label>
      <input class="text-input" id="shelterAddressInput" placeholder="例：東京都〇〇区〇〇4-5-6" />
    </div>
    <button class="sub-button" type="button" id="shelterCheckButton">地図で確認する</button>
    <div class="map-preview" id="shelterMap" hidden></div>
    <p class="map-hint" id="shelterMapHint"></p>
    <button class="register-button" type="button" id="shelterAddButton" disabled>この内容で追加する</button>
  </div>

  <div class="card">
    <p class="card-heading">避難所一覧</p>
    <div id="shelterListContainer"></div>
  </div>

  <a class="menu-button" href="/disaster.html" target="_blank" rel="noopener" style="display:flex;justify-content:center;text-decoration:none;">👀 住民用の画面を見る</a>
</div>
<script src="disaster.js"></script>
</body>
</html>
