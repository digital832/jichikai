<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>出欠状況</title>
<style>
  :root { --green: #06c755; --red: #ef4444; --bg: #f4f6f5; --text: #1c1f1e; --text-sub: #6b716f; --border: #e4e7e5; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    padding: 20px;
  }
  .page { max-width: 480px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 24px 20px;
    margin-bottom: 14px;
  }
  .event-name { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .event-date { font-size: 14px; color: var(--text-sub); margin: 0 0 4px; }
  .officer-note { font-size: 11px; color: var(--text-sub); margin: 0; }
  .counts { display: flex; gap: 10px; margin-top: 16px; }
  .count-box { flex: 1; text-align: center; background: var(--bg); border-radius: 12px; padding: 14px 6px; }
  .count-num { font-size: 24px; font-weight: 700; }
  .count-label { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .list-title { font-size: 14px; font-weight: 700; margin: 0 0 10px; }
  .resp-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .resp-row:last-child { border-bottom: none; }
  .resp-status { font-weight: 700; }
  .resp-status.attend { color: var(--green); }
  .resp-status.not-attend { color: var(--red); }
  .error-text { color: var(--red); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="page">
  <div id="loadingView"><p>読み込み中です…</p></div>

  <div id="contentView" hidden>
    <div class="card">
      <p class="event-name" id="eventNameText"></p>
      <p class="event-date" id="eventDateText"></p>
      <p class="officer-note">※このリンクは役員向けです。個人を特定しないため、誰が開いても同じ結果が見えます。</p>
      <div class="counts">
        <div class="count-box"><div class="count-num" id="attendCount">0</div><div class="count-label">参加</div></div>
        <div class="count-box"><div class="count-num" id="notAttendCount">0</div><div class="count-label">不参加</div></div>
        <div class="count-box"><div class="count-num" id="noReplyCount">0</div><div class="count-label">未回答</div></div>
      </div>
    </div>
    <div class="card">
      <p class="list-title">回答済みの方</p>
      <div id="respList"></div>
    </div>
  </div>

  <div id="errorView" hidden><p class="error-text">このリンクは無効です。</p></div>
</div>
<script src="attendance-status.js"></script>
</body>
</html>
