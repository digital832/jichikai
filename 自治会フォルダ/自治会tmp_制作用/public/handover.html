<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新しいパスワード</title>
<link rel="stylesheet" href="admin/broadcast.css" />
<style>
  .community-name-label { font-size: 13px; color: var(--text-sub); margin: 0 0 4px; }
  .card { padding: 22px 20px 24px; }
  .card-title { font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  .lead { font-size: 14px; line-height: 1.8; color: var(--text); margin: 0 0 20px; }
  .lead b { font-weight: 700; }
  .code-input {
    width: 100%; padding: 16px 14px; font-size: 30px; font-weight: 700;
    letter-spacing: 12px; text-align: center; text-indent: 12px;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: var(--radius-input); color: var(--text); font-family: inherit;
  }
  .code-input:focus { outline: none; border-color: var(--green); background: #fff; }
  .code-input::placeholder { letter-spacing: 4px; text-indent: 4px; font-size: 16px; font-weight: 400; color: #b4b9b7; }
  .hint { font-size: 12px; line-height: 1.7; color: var(--text-sub); margin: 10px 2px 0; }
  .error-text { font-size: 13px; color: #c0392b; min-height: 20px; margin: 10px 2px 14px; }
  .send-button:disabled { opacity: 0.6; box-shadow: none; }
  .done-mark {
    width: 56px; height: 56px; border-radius: 50%; background: var(--green-light);
    display: flex; align-items: center; justify-content: center; margin: 0 0 14px;
  }
  .done-mark svg { width: 28px; height: 28px; }
  .next-list { margin: 0 0 20px; padding: 0; list-style: none; }
  .next-list li {
    display: flex; align-items: center; gap: 12px; padding: 11px 0;
    border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .next-list li:last-child { border-bottom: none; }
  .next-num {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--green); color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .link-button {
    display: block; text-align: center; text-decoration: none; margin-bottom: 10px;
  }
  .word-button.link-button { padding: 14px; }
</style>
</head>
<body>
<div class="page" style="padding-top:28px;">
  <div class="card">
    <p class="community-name-label" id="communityName"></p>

    <div id="loadingArea">
      <h1 class="card-title" id="loadingText">読み込み中…</h1>
    </div>

    <div id="formArea" hidden>
      <h1 class="card-title">新しいパスワードを決めてください</h1>
      <p class="lead"><b id="targetName"></b> 様、自治会長のお役目、よろしくお願いします。<br />ご自身で覚えやすい数字6桁を入れてください。</p>
      <div class="field">
        <label class="field-label" for="newCode">新しいパスワード</label>
        <input class="code-input" type="text" id="newCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="数字6桁" />
        <p class="hint">この番号で管理画面にログインします。他の人には教えないでください。</p>
      </div>
      <p class="error-text" id="message"></p>
      <button class="send-button" type="button" id="saveButton">これで決める</button>
    </div>

    <div id="doneArea" hidden>
      <div class="done-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#05a648" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h1 class="card-title">設定できました</h1>
      <p class="lead">新しいパスワードは、LINEにもお送りしました。<br />つぎの順番で進めてください。</p>
      <ul class="next-list">
        <li><span class="next-num">1</span>役員任命（役員の決定・パスワードの共有）</li>
        <li><span class="next-num">2</span>予約配信</li>
        <li><span class="next-num">3</span>管理画面</li>
      </ul>
      <a class="send-button link-button" href="/admin/officers.html">役員任命へ進む</a>
      <a class="word-button link-button" href="/admin/home.html">管理画面へ</a>
    </div>
  </div>
</div>
<script src="handover.js"></script>
</body>
</html>
