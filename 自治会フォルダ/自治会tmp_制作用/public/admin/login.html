<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理画面ログイン</title>
<link rel="stylesheet" href="broadcast.css" />
<style>
  html, body {
    height: 100%;
  }
  body {
    min-height: 100vh;
    /* スマホはアドレスバーの出入りで100vhが実際の画面より大きくなり、
       カードが画面外にはみ出て「崩れて見える」ため、動的ビューポート単位で上書きする */
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    overflow: hidden;
    background: #10241a url('login-bg.jpg') center/cover no-repeat;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(6, 30, 18, 0.1), rgba(6, 30, 18, 0.25));
  }
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  .login-card {
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: var(--radius-card);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
    padding: 28px 24px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .login-card h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 18px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  }
  #code {
    width: 100%;
    box-sizing: border-box;
    font-size: 24px;
    letter-spacing: 8px;
    text-align: center;
    padding: 12px 0;
    margin-bottom: 14px;
    border-radius: 999px;
  }
  .error {
    color: var(--red);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 6px;
  }
  .login-hint {
    color: #fff;
    background: rgba(0, 0, 0, 0.28);
    border-radius: 999px;
    font-size: 13px;
    padding: 8px 14px;
    margin: 0 0 14px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="login-card">
      <h1>管理画面ログイン</h1>
      <p class="login-hint" id="loginHint" hidden></p>
      <form id="login-form">
        <input class="text-input" type="text" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" autofocus />
        <div class="error" id="error"></div>
        <button class="send-button" type="submit" id="submit">ログイン</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const codeInput = document.getElementById('code');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit');
    const loginHintEl = document.getElementById('loginHint');

    // サンプル自治会など見学用の環境でだけ、今のログイン番号を案内する（通常の自治会では出ない）
    fetch('/api/auth/login-hint')
      .then((res) => res.json())
      .then((data) => {
        if (data.show && data.code) {
          loginHintEl.textContent = `見学用ログイン番号: ${data.code}`;
          loginHintEl.hidden = false;
        }
      })
      .catch(() => {});

    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    // 「戻る」でこのページがブラウザのキャッシュ(bfcache)から復元された時、
    // ログイン成功時に無効化したままのボタンが固まって見えてしまうため、表示のたびに戻す
    window.addEventListener('pageshow', () => {
      submitBtn.disabled = false;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const code = codeInput.value;
      if (code.length !== 6) {
        errorEl.textContent = '6桁の番号を入力してください';
        return;
      }
      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'ログインに失敗しました';
          submitBtn.disabled = false;
          return;
        }
        const params = new URLSearchParams(location.search);
        location.href = params.get('next') || '/admin/home.html';
      } catch (err) {
        errorEl.textContent = '通信に失敗しました';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
