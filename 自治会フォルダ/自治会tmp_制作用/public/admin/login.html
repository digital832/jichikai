<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理画面ログイン</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #000 url('login-bg.jpg') center/cover no-repeat;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.4));
  }
  .brand {
    position: relative;
    text-align: center;
    margin-bottom: 28px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.45);
  }
  .brand-title {
    font-size: 34px;
    letter-spacing: 0.12em;
    margin: 0;
    font-weight: 600;
  }
  .brand-sub {
    font-size: 13px;
    letter-spacing: 0.2em;
    margin: 8px 0 0;
    opacity: 0.9;
  }
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  .card {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(6px);
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    padding: 36px 32px;
    width: 300px;
    text-align: center;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.08em;
    margin: 0 0 22px;
    color: #2b2b2b;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    font-size: 24px;
    letter-spacing: 8px;
    text-align: center;
    padding: 12px 0;
    border: 1px solid #cfcac2;
    border-radius: 2px;
    margin-bottom: 16px;
    font-family: inherit;
    background: #fdfcfa;
  }
  input:focus {
    outline: none;
    border-color: #2d7d46;
  }
  button {
    width: 100%;
    padding: 12px 0;
    font-size: 15px;
    letter-spacing: 0.15em;
    border: none;
    border-radius: 2px;
    background: #2d3d33;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled {
    background: #9aa79f;
    cursor: default;
  }
  .error {
    color: #c0392b;
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">
      <p class="brand-title">自治会アプリ</p>
      <p class="brand-sub">管理画面</p>
    </div>
    <div class="card">
      <h1>ログイン</h1>
      <form id="login-form">
        <input type="text" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="6桁の番号" autofocus />
        <div class="error" id="error"></div>
        <button type="submit" id="submit">ログイン</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const codeInput = document.getElementById('code');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit');

    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    // 「戻る」でこのページがブラウザのキャッシュ(bfcache)から復元された時、
    // ログイン成功時に無効化したままのボタンが固まって見えてしまうため、表示のたびに戻す
    window.addEventListener('pageshow', () => {
      submitBtn.disabled = false;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const code = codeInput.value;
      if (code.length !== 6) {
        errorEl.textContent = '6桁の番号を入力してください';
        return;
      }
      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'ログインに失敗しました';
          submitBtn.disabled = false;
          return;
        }
        const params = new URLSearchParams(location.search);
        location.href = params.get('next') || '/admin/home.html';
      } catch (err) {
        errorEl.textContent = '通信に失敗しました';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
