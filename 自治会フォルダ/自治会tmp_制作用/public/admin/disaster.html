<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>防災</title>
<link rel="stylesheet" href="broadcast.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* シニアの方にも見やすいよう、防災ページだけ文字と余白を大きめにする */
  .bousai-page .page-title { font-size: 22px; font-weight: 800; margin: 4px 0 4px; display: flex; align-items: center; gap: 8px; }
  .bousai-page .page-lead { font-size: 14px; color: var(--text-sub); margin: 0 0 18px; line-height: 1.6; }
  .bousai-page .section-title { font-size: 19px; font-weight: 800; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
  .bousai-page .section-title:first-of-type { margin-top: 0; }
  .bousai-page .card-heading { font-size: 17px; }
  .bousai-page .field-hint, .bousai-page .field-label { font-size: 14px; }
  .bousai-page .text-input, .bousai-page .select-input, .bousai-page .textarea-input { font-size: 16px; padding: 14px; }
  .bousai-page .toggle-text-hint { font-size: 13px; }
  .bousai-page .pill-option { font-size: 14px; padding: 11px 18px; }

  .emergency-card { border: 2px solid var(--red); background: #fff7f7; }
  .emergency-card .card-heading { color: var(--red); }
  .big-red-button {
    width: 100%; padding: 18px; border: none; border-radius: 999px;
    background: var(--red); color: #fff; font-size: 18px; font-weight: 800;
    box-shadow: 0 4px 14px rgba(239, 74, 74, 0.35); cursor: pointer;
  }
  .big-red-button:disabled { opacity: 0.6; cursor: default; }

  .status-banner { border-radius: var(--radius-card); padding: 18px; margin-bottom: 16px; }
  .status-banner.is-clear { background: var(--green-light); border: 1px solid var(--green); }
  .status-banner.is-alert { background: #fdeaea; border: 2px solid var(--red); }
  .status-banner-title { font-size: 15px; font-weight: 800; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .status-banner.is-alert .status-banner-title { color: var(--red); }
  .status-banner-nums { font-size: 14px; margin: 0; line-height: 1.7; }
  .status-banner-nums strong { font-size: 16px; }
  .status-banner-link { display: inline-block; margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--green-dark); text-decoration: none; }
  .status-banner.is-alert .status-banner-link { color: var(--red); }

  .safety-session-row { padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .safety-session-row:last-child { border-bottom: none; }
  .safety-session-name { font-weight: 700; font-size: 15px; margin: 0; }
  .safety-session-meta { font-size: 13px; color: var(--text-sub); margin: 4px 0 0; }
  .safety-missing-alert { background: #fdeaea; color: var(--red); font-weight: 700; border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 13px; }

  .safety-detail-map { width: 100%; height: 260px; border-radius: 14px; margin: 10px 0; background: var(--input-bg); }
  .safety-response-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .safety-response-row:last-child { border-bottom: none; }
  .safety-response-name { font-size: 14px; font-weight: 700; margin: 0; }
  .safety-response-status { font-size: 13px; color: var(--text-sub); margin: 2px 0 0; }

  .menu-button {
    display: inline-block;
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
  }
  .register-button {
    width: 100%;
    padding: 16px;
    margin-top: 8px;
    border: none;
    border-radius: 999px;
    background: var(--green);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .register-button:disabled { opacity: 0.5; cursor: default; }
  .sub-button {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: none;
    border-radius: var(--radius-input);
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .map-preview {
    width: 100%;
    height: 220px;
    border-radius: var(--radius-input);
    margin-bottom: 10px;
    background: var(--input-bg);
  }
  .map-hint { font-size: 13px; color: var(--text-sub); margin: 0 0 12px; min-height: 18px; }
</style>
</head>
<body class="bousai-page">
<div class="page">
  <div class="topbar">
    <a class="menu-button" href="broadcast.html" style="text-decoration:none;">▷ 配信ウィザードへ</a>
  </div>

  <p class="page-title">🚨 防災</p>
  <p class="page-lead">災害が起きたときの安否確認と、避難所などの情報をこのページにまとめています。</p>

  <div id="statusBannerContainer"></div>

  <p class="section-title">① 安否確認を送る</p>
  <div class="card emergency-card">
    <p class="card-heading">🚨 みんなの無事を確認する</p>
    <p class="field-hint" style="margin-top:-6px;">地震や台風などが起きたとき、この内容でLINEに安否確認を送ります。会員は「無事」か「行方不明」で返信します。</p>

    <div class="field">
      <label class="field-label">👥 送る相手</label>
      <div class="pill-group" id="emergencyGroupPillGroup"></div>
      <p class="field-hint">なにも選ばなければ「全員」に送ります。</p>
    </div>

    <div class="field">
      <label class="field-label" for="emergencyMessage">送るメッセージ（そのまま送れます。必要なら書き換えてください）</label>
      <textarea class="textarea-input" id="emergencyMessage"></textarea>
    </div>

    <button class="big-red-button" type="button" id="emergencySendButton">🚨 この内容で安否確認を送信する</button>
  </div>

  <p class="section-title">② 安否確認の記録を見る</p>
  <div class="card">
    <p class="card-heading">📋 これまでの安否確認</p>
    <div id="safetySessionList"><p class="event-list-empty">読み込み中...</p></div>
  </div>

  <p class="section-title">③ 避難場所の準備をする</p>
  <div class="card">
    <p class="card-heading"><span class="badge">🏠</span>拠点（自治会館など）</p>
    <div class="field">
      <label class="field-label" for="baseNameInput">名称</label>
      <input class="text-input" id="baseNameInput" placeholder="例：〇〇自治会館" />
    </div>
    <div class="field">
      <label class="field-label" for="baseAddressInput">住所</label>
      <input class="text-input" id="baseAddressInput" placeholder="例：東京都〇〇区〇〇1-2-3" />
    </div>
    <button class="sub-button" type="button" id="baseCheckButton">地図で確認する</button>
    <div class="map-preview" id="baseMap" hidden></div>
    <p class="map-hint" id="baseMapHint"></p>
    <button class="register-button" type="button" id="baseSaveButton" disabled>この内容で保存する</button>
  </div>

  <div class="card">
    <p class="card-heading"><span class="badge">⛑</span>避難所を追加・編集</p>
    <div class="field">
      <label class="field-label" for="shelterNameInput">名称</label>
      <input class="text-input" id="shelterNameInput" placeholder="例：〇〇小学校" />
    </div>
    <div class="field">
      <label class="field-label" for="shelterAddressInput">住所</label>
      <input class="text-input" id="shelterAddressInput" placeholder="例：東京都〇〇区〇〇4-5-6" />
    </div>
    <button class="sub-button" type="button" id="shelterCheckButton">地図で確認する</button>
    <div class="map-preview" id="shelterMap" hidden></div>
    <p class="map-hint" id="shelterMapHint"></p>
    <button class="register-button" type="button" id="shelterAddButton" disabled>この内容で追加する</button>
    <a href="#" id="shelterCancelEditLink" hidden style="display:block;text-align:center;margin-top:10px;color:var(--text-sub);font-size:13px;">編集をやめる</a>
  </div>

  <div class="card">
    <p class="card-heading">避難所一覧</p>
    <div id="shelterListContainer"></div>
  </div>

  <a class="menu-button" href="/disaster.html" target="_blank" rel="noopener" style="display:flex;justify-content:center;text-decoration:none;">👀 住民用の画面を見る</a>
</div>

<div class="sheet-overlay" id="safetyDetailOverlay">
  <div class="sheet-panel" id="safetyDetailPanel">
    <div class="sheet-handle"></div>
    <p class="card-heading" id="safetyDetailTitle">安否状況の詳細</p>
    <div class="safety-detail-map" id="safetyDetailMap"></div>
    <div id="safetyDetailList"></div>
    <div class="sheet-actions">
      <button class="word-button" type="button" id="closeSafetyDetailButton">閉じる</button>
    </div>
  </div>
</div>

<script src="disaster.js"></script>
</body>
</html>
