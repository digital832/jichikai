<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>自治会長の引き継ぎ</title>
<link rel="stylesheet" href="broadcast.css" />
<style>
  .page-title { font-size: 20px; font-weight: 700; margin: 0 0 16px; }
  .password-message { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .password-message.success { color: #2d7d46; }
  .password-message.error { color: #c0392b; }
  html, body { overflow-x: hidden; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="menu-button" href="home.html" style="text-decoration:none;">🏠 ホーム</a>
  </div>

  <h1 class="page-title">自治会長の引き継ぎ</h1>

  <div class="card" id="handover">
    <p class="card-heading">新しい自治会長に引き継ぐ</p>
    <p class="field-hint" style="margin-top:-6px;">引き継ぐ相手を選んで送信すると、相手のLINEに、新しいパスワードを入力するリンクと、役員任命・予約配信・管理画面へのリンクが届きます。今のログイン番号は、送信から1か月間は使えます。新自治会長が新パスワードと役員任命を済ませると、あなたにお知らせのLINEが届きます。</p>
    <div class="field">
      <label class="field-label">引き継ぐ相手</label>
      <div style="display:flex; gap:8px;">
        <select class="select-input" id="handoverGroup" style="flex:1;"></select>
        <select class="select-input" id="handoverSelect" style="flex:1.4;"></select>
      </div>
    </div>
    <p class="password-message" id="handoverMessage"></p>
    <button class="send-button" type="button" id="handoverButton" style="width:100%;">LINEで送る</button>
  </div>
</div>

<script src="auth-guard.js"></script>
<script src="password.js"></script>
</body>
</html>
