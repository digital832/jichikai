<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>名簿一覧</title>
<link rel="stylesheet" href="broadcast.css" />
<style>
  .group-filter-row { margin-bottom: 10px; }
  .group-filter-row select { width: 100%; }
  .member-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .member-row:last-child { border-bottom: none; }
  .member-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .member-sub-label { font-size: 11px; color: var(--text-sub); line-height: 1.3; }
  .member-name-input { font-weight: 700; font-size: 14px; padding: 0 10px; max-width: 160px; height: 40px; box-sizing: border-box; }
  .member-role-badge {
    flex: none; width: 68px; height: 40px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
    background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-input);
    font-size: 13px; color: var(--text); text-align: center; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .community-name-label { font-size: 13px; color: var(--text-sub); margin: 0 0 4px; }
  .role-select-wrap { display: flex; align-items: center; }
  .member-name-row { display: flex; gap: 6px; align-items: center; }
  .message-link-button {
    flex: none; font-size: 12px; font-weight: 700; padding: 0 12px; border-radius: 8px;
    height: 40px; box-sizing: border-box; display: inline-flex; align-items: center;
    background: var(--green); color: #fff; text-decoration: none; white-space: nowrap;
  }
  .member-message-button {
    flex: none; width: 40px; height: 40px; box-sizing: border-box; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
    background: var(--green); color: #fff; text-decoration: none;
  }
  .member-sub-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .member-delete-button {
    flex: none; border: none; background: none; cursor: pointer; padding: 2px 4px;
    font-size: 11px; color: #c0392b;
  }
  .delete-message { font-size: 13px; min-height: 18px; margin: 6px 0 0; color: #c0392b; }
  .delete-target { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .delete-code-input { letter-spacing: 6px; font-size: 20px; text-align: center; }
  .officers-link-row { margin: 18px 0 18px; }
  .new-role-row { display: flex; gap: 8px; align-items: center; }
  .new-role-row .text-input { flex: 1; }
  .color-dropdown { position: relative; display: inline-block; flex: none; }
  .color-dot-button {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer; padding: 0;
  }
  .color-dropdown-menu {
    position: absolute; top: 32px; left: 0; z-index: 50;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .color-dropdown-menu[hidden] { display: none; }
  .color-option-dot {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  .color-option-dot.selected { border-color: var(--text); }

  .pagination-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .pagination-row button {
    border: none;
    background: none;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .pagination-row button:disabled { color: var(--text-sub); cursor: default; opacity: 0.4; }
  .pagination-row button.current {
    background: var(--text);
    color: #fff;
    font-weight: 700;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .pagination-row .pagination-ellipsis { color: var(--text-sub); padding: 0 2px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="menu-button" href="home.html" style="text-decoration:none;">🏠 ホーム</a>
  </div>

  <div class="card">
    <p class="community-name-label" id="communityNameLabel"></p>
    <p class="card-heading with-action">
      <span class="card-heading-left">名簿一覧</span>
      <button class="template-button" type="button" id="manageRolesButton">役職を管理</button>
    </p>
    <p class="officers-link-row"><a class="message-link-button" href="officers.html">🔑 役員任命へ</a></p>
    <div class="group-filter-row">
      <select class="select-input" id="groupFilterSelect">
        <option value="">すべて</option>
      </select>
    </div>
    <div id="memberListContainer"></div>
    <div class="pagination-row" id="memberPagination"></div>
  </div>
</div>

<div class="sheet-overlay" id="deleteOverlay">
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <p class="card-heading">名簿から削除</p>
    <p class="delete-target" id="deleteTarget"></p>
    <div class="field">
      <label class="field-label" for="deleteCodeInput">自治会長のパスワード<span class="required">必須</span></label>
      <input class="text-input delete-code-input" type="password" id="deleteCodeInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" />
    </div>
    <p class="delete-message" id="deleteMessage"></p>
    <div class="sheet-actions">
      <button class="word-button" type="button" id="deleteCancelButton">キャンセル</button>
      <button class="send-button" type="button" id="deleteConfirmButton" style="background:#c0392b;">削除する</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="roleListOverlay">
  <div class="sheet-panel" id="roleListPanel">
    <div class="sheet-handle"></div>
    <p class="card-heading">役職マスタ</p>
    <div class="field">
      <label class="field-label" for="newRoleName">新しい役職名</label>
      <div class="new-role-row">
        <input class="text-input" type="text" id="newRoleName" placeholder="例：婦人会" />
        <div id="newRoleColorPicker"></div>
        <button class="icon-button" type="button" id="addRoleButton">＋</button>
      </div>
    </div>
    <div id="roleListContainer"></div>
    <div class="sheet-actions">
      <button class="word-button" type="button" id="closeRoleListButton">閉じる</button>
    </div>
  </div>
</div>

<script src="auth-guard.js"></script>
<script src="members.js"></script>
</body>
</html>
